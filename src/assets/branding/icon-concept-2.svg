<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ic2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="ic2-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ic2-leaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="ic2-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="125" fill="url(#ic2-bg)" filter="url(#ic2-shadow)" />
  <rect x="3" y="3" width="494" height="494" rx="122" fill="none" stroke="#334155" stroke-width="4" />
  <path d="M 125 3 L 375 3" stroke="url(#ic2-stroke)" stroke-width="8" stroke-linecap="round" />

  <g transform="translate(110, 115)">
    <!-- Left Stem with Fork Prongs -->
    <path d="M 50 260 L 50 100" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" />
    <path d="M 28 60 L 28 92 C 28 108, 72 108, 72 92 L 72 60" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />
    <line x1="50" y1="56" x2="50" y2="96" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />

    <!-- Center Chevron -->
    <path d="M 50 116 L 140 216 L 230 116" fill="none" stroke="url(#ic2-stroke)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Stem -->
    <path d="M 230 108 L 230 260" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" />

    <!-- Floating Organic Nutrition Leaf -->
    <path d="M 140 106 C 108 78, 108 42, 140 30 C 172 42, 172 78, 140 106 Z" fill="url(#ic2-leaf)" />
    <line x1="140" y1="42" x2="140" y2="94" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8" />

    <circle cx="230" cy="60" r="14" fill="#10B981" />
  </g>
</svg>
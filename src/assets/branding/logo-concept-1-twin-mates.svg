<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="c1-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Warm Accent Gradient for Cloche Plate -->
    <linearGradient id="c1-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="c1-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.3" />
    </filter>

    <filter id="c1-icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ICON CONTAINER (Squircle Badge) -->
  <g transform="translate(30, 20)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#c1-bg-grad)" filter="url(#c1-shadow)" />

    <!-- Subtle Inner Border Highlight -->
    <rect x="1.5" y="1.5" width="197" height="197" rx="46.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3" />

    <!-- ICON ARTWORK: The Twin Mates "M" + Dining Plate / Cloche -->
    <g transform="translate(25, 26)" filter="url(#c1-icon-glow)">
      <!-- Left Mate Head & Body forming left leg of 'M' -->
      <circle cx="36" cy="42" r="14" fill="#FFFFFF" />
      <path d="M 22 126 C 22 92, 34 70, 50 70 C 66 70, 75 88, 75 108 L 75 126" 
            fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Right Mate Head & Body forming right leg of 'M' -->
      <circle cx="114" cy="42" r="14" fill="#FFFFFF" />
      <path d="M 75 126 L 75 108 C 75 88, 84 70, 100 70 C 116 70, 128 92, 128 126" 
            fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Center Table / Dining Plate with Cloche Dome -->
      <!-- Cloche Dome Arch -->
      <path d="M 52 110 C 52 86, 98 86, 98 110 Z" fill="url(#c1-accent-grad)" />
      <!-- Cloche Top Knob -->
      <circle cx="75" cy="84" r="5" fill="#FDE68A" />
      <!-- Plate Platter Line -->
      <line x1="44" y1="113" x2="106" y2="113" stroke="#FDE68A" stroke-width="5" stroke-linecap="round" />

      <!-- Rising Fresh Steam Arcs -->
      <path d="M 66 74 C 64 66, 68 62, 66 54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85" />
      <path d="M 75 72 C 73 64, 77 60, 75 50" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.95" />
      <path d="M 84 74 C 82 66, 86 62, 84 54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85" />

      <!-- Friendly Smile Curve at the Bottom Center of the Table -->
      <path d="M 58 132 Q 75 144 92 132" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- TYPOGRAPHY / WORDMARK -->
  <g transform="translate(265, 50)">
    <!-- Primary Logotype -->
    <text x="0" y="80" font-family="'Inter', 'Poppins', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="72" letter-spacing="-1.5">
      <tspan fill="#0F172A">MESS</tspan><tspan fill="#10B981">MATES</tspan>
    </text>

    <!-- Tagline & Descriptor -->
    <text x="4" y="118" font-family="'Inter', 'Poppins', -apple-system, sans-serif" font-weight="700" font-size="16" fill="#059669" letter-spacing="4">
      CAMPUS DINING MADE INTELLIGENT
    </text>

    <!-- Subtitle Pill / Quality Badge -->
    <g transform="translate(4, 136)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5" />
      <circle cx="12" cy="12" r="4" fill="#10B981" />
      <text x="24" y="16" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#047857" letter-spacing="0.5">
        OFFICIAL HOSTEL PLATFORM
      </text>
    </g>
  </g>
</svg>
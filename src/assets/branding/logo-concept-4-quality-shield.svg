<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Royal Navy & Emerald Gradient -->
    <linearGradient id="c4-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="c4-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Deep Authority Shadow -->
    <filter id="c4-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ICON CONTAINER (Hexagonal Shield) -->
  <g transform="translate(30, 20)">
    <!-- Base Shield Shape -->
    <path d="M 100 12 L 180 44 C 180 120, 140 166, 100 190 C 60 166, 20 120, 20 44 Z" 
          fill="url(#c4-shield-grad)" filter="url(#c4-shadow)" />

    <!-- Inner Gold Filigree Inset Border -->
    <path d="M 100 24 L 168 52 C 168 116, 134 154, 100 174 C 66 154, 32 116, 32 52 Z" 
          fill="none" stroke="url(#c4-gold-grad)" stroke-width="2.5" stroke-opacity="0.7" />

    <!-- SHIELD INNER ARTWORK: Crossed Silver Utensils + 5 Stars of Quality + "M" Monogram -->
    <g transform="translate(48, 48)">
      <!-- Crossed Fork and Spoon -->
      <!-- Spoon (tilted right) -->
      <path d="M 28 82 L 76 34 C 82 28, 90 28, 92 36 C 94 44, 88 52, 82 58 L 34 106 Z" fill="#E2E8F0" fill-opacity="0.25" />
      <path d="M 26 84 L 74 36" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <ellipse cx="80" cy="30" rx="9" ry="13" transform="rotate(45 80 30)" fill="#FFFFFF" />

      <!-- Fork (tilted left) -->
      <path d="M 76 84 L 28 36" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <path d="M 22 42 L 34 30" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="36" x2="18" y2="26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="32" y1="32" x2="22" y2="22" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="24" y1="40" x2="14" y2="30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

      <!-- Center Quality Star -->
      <path d="M 52 48 L 56 60 L 68 60 L 58 68 L 62 80 L 52 72 L 42 80 L 46 68 L 36 60 L 48 60 Z" fill="url(#c4-gold-grad)" />

      <!-- Lower Ribbon / Monogram Badge "M" -->
      <rect x="36" y="88" width="32" height="18" rx="6" fill="#10B981" />
      <text x="52" y="102" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">M</text>
    </g>
  </g>

  <!-- TYPOGRAPHY / WORDMARK -->
  <g transform="translate(265, 52)">
    <!-- Primary Bold Brand Title -->
    <text x="0" y="78" font-family="'Cinzel', 'Poppins', 'Inter', serif" font-weight="900" font-size="64" letter-spacing="1">
      <tspan fill="#1E3A8A">MESS</tspan><tspan fill="#059669">MATES</tspan>
    </text>

    <!-- Governance & Standards Tagline -->
    <text x="4" y="116" font-family="'Inter', sans-serif" font-weight="700" font-size="15" fill="#475569" letter-spacing="4">
      TRUSTED CAMPUS FOOD GOVERNANCE
    </text>

    <!-- Quality Assurance Seals -->
    <g transform="translate(4, 134)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="26" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" />
        <text x="12" y="17" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" fill="#1E40AF">🛡 VERIFIED HYGIENE</text>
      </g>
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="130" height="26" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5" />
        <text x="12" y="17" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" fill="#065F46">★ AUDITED MENUS</text>
      </g>
    </g>
  </g>
</svg>
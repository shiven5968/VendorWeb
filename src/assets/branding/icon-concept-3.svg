<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ic3-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="ic3-bowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="ic3-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="125" fill="#FFFFFF" filter="url(#ic3-shadow)" />
  <rect x="3" y="3" width="494" height="494" rx="122" fill="none" stroke="#F1F5F9" stroke-width="6" />

  <g transform="translate(75, 75)">
    <!-- Infinity Steam Loop -->
    <path d="M 105 180 C 105 110, 155 75, 180 110 C 205 145, 168 180, 180 206 C 190 224, 212 220, 230 198 C 252 168, 260 110, 290 132 C 316 154, 304 206, 264 228"
          fill="none" stroke="url(#ic3-warm)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Rising 'm' Steam -->
    <path d="M 148 150 Q 166 106 184 150 Q 202 194 220 150" fill="none" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" />

    <!-- The Dining Bowl Base -->
    <path d="M 72 220 C 80 318, 286 318, 294 220 Z" fill="url(#ic3-bowl)" />
    <!-- Bowl Rim Platter Highlight -->
    <path d="M 58 220 C 58 208, 308 208, 308 220 C 308 232, 58 232, 58 220 Z" fill="#34D399" />

    <!-- Heartwarming Smile Accent -->
    <circle cx="183" cy="268" r="22" fill="#FFFFFF" fill-opacity="0.2" />
    <path d="M 160 268 Q 183 286 206 268" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
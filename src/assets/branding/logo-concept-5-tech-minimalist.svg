<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Ultra Modern Emerald Gradient -->
    <linearGradient id="c5-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Deep Clean Drop Shadow -->
    <filter id="c5-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35" />
    </filter>

    <filter id="c5-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ICON CONTAINER (Modern App Icon with Smooth 22.5% Curvature) -->
  <g transform="translate(30, 20)">
    <!-- Squircle Background with High-End Elevation -->
    <rect x="0" y="0" width="200" height="200" rx="56" fill="url(#c5-grad)" filter="url(#c5-shadow)" />

    <!-- Pure Minimalist Dual Plate & Twin Fork Glyphs forming "MM" -->
    <g transform="translate(36, 40)" filter="url(#c5-glow)">
      <!-- Outer Dining Plate Circle Ring -->
      <circle cx="64" cy="60" r="50" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-opacity="0.95" />
      
      <!-- Inner Food Bowl / Smile Accent -->
      <path d="M 36 68 Q 64 96 92 68" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

      <!-- Twin Stylized Chef / Student Dots (The "Mates" connection) -->
      <circle cx="48" cy="42" r="8" fill="#FFFFFF" />
      <circle cx="80" cy="42" r="8" fill="#FFFFFF" />

      <!-- Center Nutrition Sparkle / Star -->
      <path d="M 64 24 L 67 33 L 76 36 L 67 39 L 64 48 L 61 39 L 52 36 L 61 33 Z" fill="#FDE047" />
    </g>
  </g>

  <!-- TYPOGRAPHY / WORDMARK (Modern Sans with custom glyph touches) -->
  <g transform="translate(265, 50)">
    <!-- Primary Logotype -->
    <text x="0" y="80" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="74" letter-spacing="-2">
      <tspan fill="#0F172A">mess</tspan><tspan fill="#10B981">mates</tspan><tspan fill="#F59E0B">.</tspan>
    </text>

    <!-- Clean Tech Subtitle -->
    <text x="4" y="118" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="16" fill="#64748B" letter-spacing="4">
      INTELLIGENT CAMPUS DINING
    </text>

    <!-- Version & Event Badge -->
    <g transform="translate(4, 136)">
      <rect x="0" y="0" width="168" height="24" rx="12" fill="#0F172A" />
      <circle cx="12" cy="12" r="4" fill="#34D399" />
      <text x="24" y="16" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" letter-spacing="1">
        ENTERPRISE ED.
      </text>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ic1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="ic1-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="ic1-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#047857" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="120" fill="url(#ic1-bg)" filter="url(#ic1-shadow)" />
  <rect x="3" y="3" width="494" height="494" rx="117" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" />

  <!-- Centered Artwork -->
  <g transform="translate(100, 95)">
    <!-- Left Mate Head & Body forming left leg of 'M' -->
    <circle cx="72" cy="74" r="28" fill="#FFFFFF" />
    <path d="M 44 242 C 44 174, 68 130, 100 130 C 132 130, 150 166, 150 206 L 150 242" 
          fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Mate Head & Body forming right leg of 'M' -->
    <circle cx="228" cy="74" r="28" fill="#FFFFFF" />
    <path d="M 150 242 L 150 206 C 150 166, 168 130, 200 130 C 232 130, 256 174, 256 242" 
          fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cloche Food Platter Centerpiece -->
    <path d="M 104 210 C 104 162, 196 162, 196 210 Z" fill="url(#ic1-accent)" />
    <circle cx="150" cy="158" r="10" fill="#FDE68A" />
    <line x1="88" y1="216" x2="212" y2="216" stroke="#FDE68A" stroke-width="10" stroke-linecap="round" />

    <!-- Fresh Steam -->
    <path d="M 132 138 C 128 122, 136 114, 132 98" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9" />
    <path d="M 150 134 C 146 118, 154 110, 150 90" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-opacity="0.95" />
    <path d="M 168 138 C 164 122, 172 114, 168 98" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9" />

    <!-- Fellowship Smile -->
    <path d="M 116 254 Q 150 278, 184 254" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
  </g>
</svg>
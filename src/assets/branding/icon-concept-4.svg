<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ic4-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="ic4-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="ic4-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="125" fill="#F8FAFC" />
  
  <g transform="translate(50, 35)">
    <!-- Base Shield -->
    <path d="M 200 24 L 360 88 C 360 240, 280 332, 200 380 C 120 332, 40 240, 40 88 Z" 
          fill="url(#ic4-shield)" filter="url(#ic4-shadow)" />

    <!-- Gold Inset Filigree Border -->
    <path d="M 200 48 L 336 104 C 336 232, 268 308, 200 348 C 132 308, 64 232, 64 104 Z" 
          fill="none" stroke="url(#ic4-gold)" stroke-width="5" stroke-opacity="0.75" />

    <!-- Crossed Utensils & Stars -->
    <g transform="translate(95, 95)">
      <!-- Spoon -->
      <path d="M 52 168 L 148 72 C 160 60, 176 60, 180 76 C 184 92, 172 108, 160 120 L 64 216 Z" fill="#E2E8F0" fill-opacity="0.25" />
      <path d="M 48 172 L 144 76" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
      <ellipse cx="156" cy="64" rx="18" ry="26" transform="rotate(45 156 64)" fill="#FFFFFF" />

      <!-- Fork -->
      <path d="M 152 172 L 56 76" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
      <path d="M 44 88 L 68 64" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
      <line x1="56" y1="76" x2="36" y2="56" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="64" y1="68" x2="44" y2="48" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="48" y1="84" x2="28" y2="64" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

      <!-- 5-Star Crest -->
      <path d="M 105 96 L 113 120 L 137 120 L 117 136 L 125 160 L 105 144 L 85 160 L 93 136 L 73 120 L 97 120 Z" fill="url(#ic4-gold)" />

      <!-- Monogram Tag -->
      <rect x="73" y="176" width="64" height="36" rx="12" fill="#10B981" />
      <text x="105" y="202" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">M</text>
    </g>
  </g>
</svg>
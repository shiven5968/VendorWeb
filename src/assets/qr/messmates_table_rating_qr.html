<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MessMates — Live Meal Rating Scanner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .standee-card {
      width: 380px;
      background: #ffffff;
      border-radius: 28px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(6, 78, 59, 0.15), 0 0 0 1px rgba(16, 185, 129, 0.2);
      border: 3px solid #10b981;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 900;
      color: #064e3b;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    .tagline {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #059669;
      background: #ecfdf5;
      padding: 4px 12px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .heading {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .subtext {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .qr-container {
      background: #f8fafc;
      padding: 16px;
      border-radius: 24px;
      border: 2px dashed #cbd5e1;
      display: inline-block;
      margin-bottom: 20px;
    }
    .qr-img {
      width: 240px;
      height: 240px;
      display: block;
      border-radius: 12px;
    }
    .reward-pill {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      padding: 10px 18px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
      margin-bottom: 16px;
    }
    .footer-note {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }
    @media print {
      body { background: white; padding: 0; }
      .standee-card { box-shadow: none; border-width: 2px; }
    }
  </style>
</head>

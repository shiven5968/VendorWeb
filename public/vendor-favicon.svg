<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="100" height="100" rx="28" fill="url(#grad)" />
  
  <!-- Merchant Canopy / Awning -->
  <path d="M22 40 L28 24 L72 24 L78 40 Z" fill="#fcd34d" filter="url(#shadow)" />
  <!-- Awning Stripes -->
  <path d="M36 24 L34 40 M50 24 L50 40 M64 24 L66 40" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Storefront Body -->
  <rect x="25" y="40" width="50" height="36" rx="6" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Doorway Arch -->
  <path d="M42 76 L42 54 C42 51 45 49 50 49 C55 49 58 51 58 54 L58 76 Z" fill="#059669" />
  
  <!-- Display Windows with Reflection -->
  <rect x="29" y="48" width="10" height="12" rx="3" fill="#60a5fa" />
  <path d="M30 50 L37 57" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <rect x="61" y="48" width="10" height="12" rx="3" fill="#60a5fa" />
  <path d="M62 50 L69 57" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Golden Star / Badge -->
  <circle cx="50" cy="32" r="3.5" fill="#ffffff" />
</svg>
